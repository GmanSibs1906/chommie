<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chommie - your classes</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../fonts/fonts.css" />
  <link rel="stylesheet" href="../screen.css" />
  <link rel="stylesheet" href="../site.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body class="app">
<header class="app-head">
  <div class="wrap app-head-row">
    <a href="/" class="app-logo">Chommie</a>
    <span class="app-class mono" id="class-label"></span>
    <button class="btn btn--ghost" id="btn-back" type="button" hidden>Back</button>
    <button class="btn btn--ghost" id="btn-logout" type="button" hidden>Log out</button>
  </div>
  <p class="demo-banner" id="demo-banner" hidden>Demo run: made-up learners and books. No real learner data.</p>
</header>
<div id="agent-slot"></div>
<main class="wrap app-main" id="view" tabindex="-1"></main>
<div id="print-sheets" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="./main.js"></script>
</body>
</html>
