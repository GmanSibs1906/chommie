[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["shared/**"]

[dev]
  port = 8888
  framework = "#static"
  publish = "."

[[headers]]
  for = "/app/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(self)"
